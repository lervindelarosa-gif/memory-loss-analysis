<!doctype html>
<!-- The moving brain from the first slide, resized for the app's left menu. No data: only decoration. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,S,ox,oy,nodes=[],edges=[],adj=[],pulses=[],brain;
const R=Math.random;
function shape(){const p=new Path2D();const P=(a,b)=>[ox+a*S,oy+b*S];
p.moveTo(...P(.10,.52));
p.bezierCurveTo(...P(.04,.28),...P(.24,.06),...P(.45,.09));
p.bezierCurveTo(...P(.62,.01),...P(.88,.07),...P(.93,.30));
p.bezierCurveTo(...P(1.0,.46),...P(.93,.62),...P(.80,.65));
p.bezierCurveTo(...P(.86,.74),...P(.78,.84),...P(.66,.80));
p.bezierCurveTo(...P(.62,.79),...P(.60,.76),...P(.60,.72));
p.bezierCurveTo(...P(.58,.82),...P(.56,.92),...P(.55,.98));
p.lineTo(...P(.48,.98));
p.bezierCurveTo(...P(.49,.88),...P(.49,.78),...P(.45,.72));
p.bezierCurveTo(...P(.30,.74),...P(.14,.70),...P(.10,.52));
p.closePath();return p}
function build(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;
S=Math.min(W,H)*0.98;ox=(W-S)/2;oy=(H-S)/2+S*0.01;brain=shape();
nodes=[];let tries=0;const N=95;
while(nodes.length<N&&tries<24000){tries++;const px=ox+R()*S,py=oy+R()*S;
if(!x.isPointInPath(brain,px,py))continue;
if(nodes.some(n=>Math.hypot(n.ax-px,n.ay-py)<S*0.055))continue;
nodes.push({ax:px,ay:py,x:px,y:py,ph:R()*6.28,sp:.4+R()*.8,amp:S*(.004+R()*.008),glow:0,fz:-99,f:0,r:S*(.009+R()*.006)})}
edges=[];adj=nodes.map(()=>[]);
nodes.forEach((a,i)=>{const near=nodes.map((b,j)=>[j,Math.hypot(a.ax-b.ax,a.ay-b.ay)]).filter(v=>v[0]!==i).sort((p,q)=>p[1]-q[1]).slice(0,3);
near.forEach(([j,dd])=>{if(dd<S*.2&&!adj[i].includes(j)){edges.push([i,j]);adj[i].push(j);adj[j].push(i)}})});
pulses=[]}
function fire(from,to,gen){pulses.push({a:from,b:to,t:0,v:.012+R()*.012,gen})}
// Memory loss: now and then a patch of neurons goes grey and a memory drifts away, then the patch recovers
const WORDS=['keys','names','birthdays','phone','faces','passwords','that song'];
let words=[],nextFade=1.5,wi=0;
function fadeLevel(n,t){const a=t-n.fz;if(a<0)return 0;if(a<1.2)return a/1.2;if(a<3.6)return 1;if(a<6)return 1-(a-3.6)/2.4;return 0}
function forget(t){const live=words.filter(w=>t-w.t0<4.2);if(live.length>=1)return;
let c=null;for(let k=0;k<40&&!c;k++){const n=nodes[(R()*nodes.length)|0];
if(n.ay>oy+S*.68||n.ax<ox+S*.22||n.ax>ox+S*.86)continue;c=n}
if(!c)return;const rad=S*(.13+R()*.05);
nodes.forEach(n=>{if(Math.hypot(n.ax-c.ax,n.ay-c.ay)<rad)n.fz=t+Math.hypot(n.ax-c.ax,n.ay-c.ay)/rad*.5});
const cx=ox+S*.52,cy=oy+S*.42;let dx=c.ax-cx,dy=c.ay-cy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
words.push({s:WORDS[wi++%WORDS.length],x:c.ax,y:c.ay,dx,dy,t0:t+.6})}
let tick=0;
function frame(){tick++;x.clearRect(0,0,W,H);const t=performance.now()/1000;
if(t>nextFade){forget(t);nextFade=t+3.2+R()*1.6}
const g=x.createRadialGradient(W/2,H/2,S*.05,W/2,H/2,S*.6);g.addColorStop(0,'rgba(240,163,107,0.10)');g.addColorStop(1,'rgba(240,163,107,0)');
x.fillStyle=g;x.fill(brain);
x.lineWidth=S*.008;x.strokeStyle='rgba(30,42,68,0.45)';x.stroke(brain);
nodes.forEach(n=>{n.x=n.ax+Math.cos(t*n.sp+n.ph)*n.amp;n.y=n.ay+Math.sin(t*n.sp*1.3+n.ph)*n.amp;n.glow*=.94;n.f=fadeLevel(n,t);if(n.f>.3)n.glow=0});
x.lineWidth=S*.004;
edges.forEach(([i,j])=>{const a=nodes[i],b=nodes[j];const f=Math.max(a.f,b.f);const k=(.18+.5*Math.max(a.glow,b.glow))*(1-.85*f);
x.strokeStyle=f>.05?'rgba(150,142,128,'+(k*0.9).toFixed(3)+')':'rgba(42,56,86,'+(k*0.8).toFixed(3)+')';
x.setLineDash(f>.4?[S*.012,S*.014]:[]);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()});
x.setLineDash([]);
if(tick%10===0&&edges.length){const e=edges[(R()*edges.length)|0];if(nodes[e[0]].f<.3)fire(e[0],e[1],0)}
const keep=[];
pulses.forEach(p=>{p.t+=p.v;const a=nodes[p.a],b=nodes[p.b];
if(b.f>.3&&p.t>.5)return;
if(p.t>=1){b.glow=1;if(p.gen<4){const nx=adj[p.b].filter(j=>j!==p.a);if(nx.length&&R()<.75)fire(p.b,nx[(R()*nx.length)|0],p.gen+1);if(nx.length>1&&R()<.25)fire(p.b,nx[(R()*nx.length)|0],p.gen+1)}return}
keep.push(p);const px=a.x+(b.x-a.x)*p.t,py=a.y+(b.y-a.y)*p.t;
const rg=x.createRadialGradient(px,py,0,px,py,S*.03);rg.addColorStop(0,'rgba(180,83,42,0.95)');rg.addColorStop(1,'rgba(240,163,107,0)');
x.fillStyle=rg;x.beginPath();x.arc(px,py,S*.03,0,6.29);x.fill()});
pulses=keep.slice(-120);
nodes.forEach(n=>{const r=n.r*(1+n.glow*1.2)*(1-.35*n.f);
if(n.glow>.05){x.fillStyle='rgba(240,163,107,'+(n.glow*.35).toFixed(3)+')';x.beginPath();x.arc(n.x,n.y,r*3.2,0,6.29);x.fill()}
x.fillStyle=n.f>.3?'rgba(170,163,150,'+(1-.4*n.f).toFixed(3)+')':(n.glow>.2?'#B4532A':'#2A3856');x.beginPath();x.arc(n.x,n.y,r,0,6.29);x.fill()});
x.textAlign='center';x.textBaseline='middle';
words=words.filter(w=>{const a=t-w.t0;if(a>4.2)return false;if(a<0)return true;
const al=a<.7?a/.7:Math.max(0,1-(a-.7)/3.5);const d=S*.05*a;
x.font='italic 700 '+Math.round(S*.075)+'px "Segoe UI", Arial, sans-serif';
const tw=x.measureText(w.s).width/2+S*.02;
const px=Math.min(W-tw,Math.max(tw,w.x+w.dx*d)),py=Math.min(H-S*.06,Math.max(S*.05,w.y+w.dy*d-S*.03*a));
x.fillStyle='rgba(74,81,100,'+(al*.9).toFixed(3)+')';
x.fillText(w.s,px,py);return true});
requestAnimationFrame(frame)}
addEventListener('resize',build);build();frame();
</script></body></html>
